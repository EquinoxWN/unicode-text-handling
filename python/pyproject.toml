[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unicode-text-handling"
version = "0.1.0"
description = "Why names like 'José', '山田' or one emoji break search, sorting and length checks: text handled correctly in Java, Python and JS."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[project.scripts]
uth = "unicode_text_handling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unicode_text_handling = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "../spec"]

[tool.mypy]
strict = true
files = ["src", "tests", "../spec"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/unicode_text_handling/_grapheme_data.py"]

[tool.ruff.lint]
# Bugs, security (bandit), modern syntax, imports, naming and test style; `ruff format` owns line length.
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF", "BLE"]
# RUF001-003: this project is about look-alike characters, so they appear on purpose.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert on purpose.
"tests/**" = ["S101"]
